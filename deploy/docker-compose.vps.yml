# Hostinger VPS deployment — the compose project actually running on the
# VPS (Docker Manager project "raydan").
#
# Note: Hostinger's Docker Manager does not run `build:` instructions, so
# the app is built at container start instead: the `web` service clones
# the public repository, runs `npm ci && npm run build` once into the
# cached `app` volume, and then serves with `npm start`. On subsequent
# restarts it fetches the latest commit and rebuilds only when the
# repository has changed — so redeploying after a `git push` is simply
# "restart the project" (hPanel → VPS → Docker Manager → raydan →
# Restart, or the API `VPS_restartProjectV1`).
#
# Caddy terminates HTTPS with automatic Let's Encrypt certificates for
# raydancafe.com and www.raydancafe.com (DNS points at the VPS).
services:
  web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - app:/app
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache git
        if [ ! -d /app/.git ]; then
          git clone https://github.com/monobile/webpageR.git /app
        fi
        cd /app
        git fetch origin || true
        git reset --hard origin/HEAD || true
        git rev-parse HEAD > /tmp/head_sha
        if [ ! -f .next/BUILD_ID ] || ! cmp -s /tmp/head_sha .deployed_sha; then
          npm ci
          npm run build
          cp /tmp/head_sha .deployed_sha
        fi
        npm start

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command:
      - sh
      - -c
      - printf 'raydancafe.com {\n  reverse_proxy web:3000\n}\nwww.raydancafe.com {\n  redir https://raydancafe.com{uri} permanent\n}\n' > /tmp/Caddyfile && caddy run --config /tmp/Caddyfile
    depends_on:
      - web

volumes:
  app:
  caddy_data:
  caddy_config:
